<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Since</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
        
        .result.show {
            display: block;
        }
        
        .result-text {
            color: #333;
            font-size: 18px;
            font-weight: 600;
        }
        
        .result-number {
            color: #667eea;
            font-size: 36px;
            font-weight: bold;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📅 Date Since</h1>
        <p class="subtitle">Calculate days since a specific date</p>
        
        <div class="input-group">
            <label for="dateInput">Enter a Date:</label>
            <input type="date" id="dateInput">
        </div>
        
        <button onclick="calculateDays()">Calculate</button>
        
        <div class="result" id="result">
            <p class="result-text">Days Since</p>
            <div class="result-number" id="daysCount">0</div>
        </div>
    </div>
    
    <script>
        function calculateDays() {
            const dateInput = document.getElementById('dateInput');
            const selectedDate = new Date(dateInput.value);
            const today = new Date();
            
            if (!dateInput.value) {
                alert('Please select a date');
                return;
            }
            
            const timeDiff = today - selectedDate;
            const daysDiff = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
            
            document.getElementById('daysCount').textContent = daysDiff;
            document.getElementById('result').classList.add('show');
        }
        
        // Allow Enter key to calculate
        document.getElementById('dateInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                calculateDays();
            }
        });
    </script>
</body>
</html>
